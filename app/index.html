<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c111d" />
    <title>Northstar · Local Developer Dashboard</title>
    <link rel="stylesheet" href="/app/styles.css" />
    <link rel="stylesheet" href="/app/session-monitor.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark"><span></span><span></span><span></span></div>
          <div><strong>NORTHSTAR</strong><small>LOCAL CONTROL ROOM</small></div>
        </div>
        <div class="workspace-switcher"><span class="status-dot"></span><span id="workspaceLabel">My Workspace</span><span class="chevron">⌄</span></div>
        <nav class="nav-list" aria-label="Main navigation">
          <button class="nav-item active" data-view="overview"><span class="nav-icon">◈</span>Overview</button>
          <button class="nav-item planner-nav" data-view="planner" hidden><span class="nav-icon">*</span>Personal Planner</button>
          <div class="nav-sublist" data-planner-subnav hidden></div>
          <button class="nav-item" data-view="github"><span class="nav-icon">◉</span>GitHub Projects</button>
          <button class="nav-item" data-view="usage"><span class="nav-icon">◌</span>AI Usage</button>
          <button class="nav-item" data-view="observability"><span class="nav-icon">⚠</span>Logs &amp; Audit</button>
          <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>Settings</button>
          <div class="nav-sublist" data-github-subnav hidden>
            <button class="nav-subitem" data-github-subview="all">Overview</button>
            <button class="nav-subitem" data-github-subview="releases">Releases</button>
            <button class="nav-subitem" data-github-subview="roadmap">Planning Board</button>
            <button class="nav-subitem" data-github-subview="ci">CI Status</button>
            <button class="nav-subitem" data-github-subview="orchestrator">Merge Orchestrator</button>
          </div>
        </nav>
        <div class="sidebar-bottom">
          <div class="sync-mini"><span class="pulse"></span><div><b id="syncLabel">Demo data</b><small id="syncTime">Waiting for sync</small></div></div>
          <div class="local-only"><span>●</span> LOCAL ONLY</div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumbs"><span>Workspace</span><b>/</b><strong id="pageTitle">Overview</strong></div>
          <div class="top-actions"><span class="last-sync" id="lastSync">Demo data</span><button class="icon-button" id="refreshButton" title="Sync data">↻</button><button class="avatar" id="avatarButton">T</button></div>
        </header>
        <section id="view-overview" class="view active-view"></section>
        <section id="view-github" class="view"></section>
        <section id="view-usage" class="view"></section>
        <section id="view-observability" class="view"></section>
        <section id="view-planner" class="view"></section>
        <section id="view-settings" class="view"></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script src="/app/github-shared.js"></script>
    <script src="/app/github-overview.js"></script>
    <script src="/app/github-releases.js"></script>
    <script src="/app/github-roadmap.js"></script>
    <script src="/app/github-ci.js"></script>
    <script src="/app/github-pages.js"></script>
    <script src="/app/app.js"></script>
    <script src="/app/session-monitor.js"></script>
    <script src="/app/merge-orchestrator.js"></script>
    <script src="/app/observability.js"></script>
    <link rel="stylesheet" href="/app/planner.css" />
    <script src="/app/planner-shared.js"></script>
    <script src="/app/planner-navigation.js"></script>
    <script src="/app/planner-tasks.js"></script>
    <script src="/app/planner-performance.js"></script>
    <script src="/app/planner-fitness.js"></script>
    <script src="/app/planner-llm.js"></script>
    <script src="/app/planner.js"></script>
  </body>
</html>

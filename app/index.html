<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c111d" />
    <title>Northstar · Local Developer Dashboard</title>
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark"><span></span><span></span><span></span></div>
          <div><strong>NORTHSTAR</strong><small>LOCAL CONTROL ROOM</small></div>
        </div>
        <div class="workspace-switcher"><span class="status-dot"></span><span id="workspaceLabel">我的工作台</span><span class="chevron">⌄</span></div>
        <nav class="nav-list" aria-label="主导航">
          <button class="nav-item active" data-view="overview"><span class="nav-icon">◈</span>总览</button>
          <button class="nav-item" data-view="github"><span class="nav-icon">◉</span>GitHub 项目</button>
          <button class="nav-item" data-view="usage"><span class="nav-icon">◌</span>AI 使用量</button>
          <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>设置</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="sync-mini"><span class="pulse"></span><div><b id="syncLabel">演示数据</b><small id="syncTime">等待同步</small></div></div>
          <div class="local-only"><span>●</span> LOCAL ONLY</div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumbs"><span>工作台</span><b>/</b><strong id="pageTitle">总览</strong></div>
          <div class="top-actions"><span class="last-sync" id="lastSync">数据来自演示模式</span><button class="icon-button" id="refreshButton" title="同步数据">↻</button><button class="avatar" id="avatarButton">T</button></div>
        </header>
        <section id="view-overview" class="view active-view"></section>
        <section id="view-github" class="view"></section>
        <section id="view-usage" class="view"></section>
        <section id="view-settings" class="view"></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script src="/app/app.js"></script>
  </body>
</html>
